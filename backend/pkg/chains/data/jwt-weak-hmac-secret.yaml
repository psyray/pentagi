id: jwt-weak-hmac-secret
name: JWT signed with a guessable HMAC secret
description: >
  A token signed with HS256 using a weak or default secret can be forged once the
  secret is guessed. Verification is offline: you crack your own token's
  signature, and you never send a forged token for another identity.
cves: []
product: JSON Web Token (JWT) authentication
affected: HS256/HS384/HS512 tokens with a low-entropy secret
cvss: 8.1
severity: high
tags: [jwt, auth, crypto, weak-secret, cwe-347]
references:
  - https://cwe.mitre.org/data/definitions/347.html
fingerprint:
  paths: ["/api", "/login", "/me"]
  signals:
    - A bearer token whose header decodes to {"alg":"HS256"}
  notes: Cracking is done locally against your own token; no request is needed to prove a weak secret.
links:
  - name: HMAC secret recovered from a wordlist
    cve: ""
    enables: forging tokens for any user once the secret is known
    verify: >
      Take your own valid HS256 token and run a local dictionary attack against
      its signature using a standard wordlist. Recovering the secret proves the
      tokens are forgeable. Keep the test offline: do NOT sign a token for
      another identity and do not send it.
remediation: >
  Use a long, random HMAC secret (at least 256 bits) stored as a secret, rotate
  it on suspicion, and prefer asymmetric signing when many services verify tokens.
