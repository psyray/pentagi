id: ad-password-spraying-soft
name: Password spraying against a small set of accounts
description: >
  Trying one common password across many accounts avoids the per-account lockout that
  repeated guesses would trigger. It is still an active, potentially disruptive action,
  so it is disabled by default: verification first reads the lockout policy, then, only
  where the engagement authorises it, attempts a single password against a very small set
  of accounts and stops at the first lockout signal.
cves: []
product: Microsoft Active Directory
affected: Domains with a weak or predictable password policy and no meaningful lockout
cvss: 7.5
severity: high
tags: [ad, password-spraying, credentials, cwe-307]
references:
  - https://cwe.mitre.org/data/definitions/307.html
  - https://www.thehacker.recipes/
  - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
fingerprint:
  paths: []
  signals:
    - A domain whose lockout policy allows at least one failed attempt without locking
    - A small set of accounts whose existence is already confirmed through enumeration
  notes: Disabled by default; run only where the engagement explicitly authorises it.
links:
  - name: Lockout policy leaves room for one attempt
    cve: ""
    enables: testing a single candidate password without locking the account
    verify: >
      Read the domain lockout policy read-only, for example with a policy query, and note
      the threshold and the observation window. If the threshold is zero or unknown, stop
      here. This step attempts nothing.
  - name: Single attempt against a small, authorised account set
    cve: ""
    enables: discovering accounts that still use a common password
    verify: >
      Only where the engagement authorises active credential testing: attempt exactly one
      password per account against a hard cap of accounts you were given, wait out the
      observation window between passes, and stop immediately on any lockout or threshold
      warning. Never spray blindly and never reuse an attempt across windows.
remediation: >
  Enforce an account lockout threshold with a sane window, ban common and seasonal
  passwords, deploy multi-factor authentication, and alert on many accounts failing in a
  short period from one source.
