id: cors-arbitrary-origin-credentials
name: CORS reflecting any origin with credentials
description: >
  An API that reflects the request's Origin into Access-Control-Allow-Origin and
  sets Allow-Credentials lets any site read authenticated responses on the
  victim's behalf. Verification is one read-only request comparing two origins.
cves: []
product: Web application or API with cross-origin access
affected: Endpoints serving authenticated JSON
cvss: 8.1
severity: high
tags: [web, cors, browser, cwe-942]
references:
  - https://cwe.mitre.org/data/definitions/942.html
  - https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/CORS%20Misconfiguration
fingerprint:
  paths: ["/api", "/api/me", "/api/user"]
  signals:
    - An Access-Control-Allow-Origin header in the response
  notes: Compare a benign origin with a foreign one; the difference is the proof.
links:
  - name: Foreign origin reflected with credentials
    cve: ""
    enables: reading authenticated API responses from any attacker-controlled site
    verify: >
      Send the request twice, once with Origin: https://example.org and once with
      your own origin, and compare the Access-Control-Allow-Origin and
      Access-Control-Allow-Credentials headers. A reflected foreign origin with
      credentials true is the proof. Read-only requests only.
remediation: >
  Allow-list the exact front-end origins, never reflect the request Origin, and
  set Allow-Credentials only for origins you trust.
