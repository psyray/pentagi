id: host-header-password-reset-poisoning
name: Host header injection poisoning a password-reset link
description: >
  An application that builds absolute links from the Host or X-Forwarded-Host
  header lets an attacker poison a password-reset link so the victim's token is
  sent to a host the attacker controls. Verification inspects the generated link
  without sending it to anyone.
cves: []
product: Web application generating absolute links
affected: Password-reset, invitation and email-verification features
cvss: 6.5
severity: medium
tags: [web, host-header, password-reset, cwe-644]
references:
  - https://cwe.mitre.org/data/definitions/644.html
  - https://hacktricks.wiki/
fingerprint:
  paths: ["/forgot", "/password/reset", "/invite"]
  signals:
    - A feature that emails a link built from the request host
  notes: Trigger the reset on your own account and read only the link you receive.
links:
  - name: Reset link reflects the request host
    cve: ""
    enables: theft of a password-reset token by redirecting the victim's link
    verify: >
      Request a password reset on your own account with a Host header you control
      and inspect the generated link in the response or in the email you receive.
      A link pointing at your host proves the injection. Do not send the link to
      anyone and do not use the token.
remediation: >
  Build absolute URLs from a configured, trusted origin, never from the request
  Host, and validate the host against an allow-list.
