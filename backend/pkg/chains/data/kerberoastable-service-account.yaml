id: kerberoastable-service-account
name: Kerberoastable service account with an SPN
description: >
  Any domain user may request a Kerberos service ticket for an account that has a
  service principal name. The ticket is encrypted with the service account's
  password-derived key, so it can be cracked offline. Verification only obtains a
  ticket for an authorised account; it does not crack or use it.
cves: []
product: Microsoft Active Directory
affected: User accounts carrying a servicePrincipalName
cvss: 7.5
severity: high
tags: [ad, kerberos, kerberoast, credentials, cwe-522]
references:
  - https://cwe.mitre.org/data/definitions/522.html
  - https://www.thehacker.recipes/
  - https://github.com/fortra/impacket
  - https://github.com/GhostPack/Rubeus
fingerprint:
  paths: []
  signals:
    - A domain account whose servicePrincipalName is set, often a service account
  notes: Requesting a ticket is read-only; cracking happens offline and is out of scope here.
links:
  - name: Service ticket obtainable for the SPN account
    cve: ""
    enables: offline cracking of the service account password, then privilege escalation
    verify: >
      From a low-privileged domain account, request a service ticket for the target
      SPN (GetUserSPNs or Rubeus kerberoast) and check that a ticket of etype RC4
      or AES is returned. Obtaining the ticket is the proof; do NOT crack it and do
      not use it against another account.
remediation: >
  Give service accounts long random passwords in managed rotation, prefer a group
  managed service account, and remove service principal names that are not needed.
