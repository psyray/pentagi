# Optional overlay: document ingestion for the skill import.
#
#   docker compose -f docker-compose.yml -f docker-compose-ingest.yml up -d
#
# The service is built from this repository (no published image yet), joins the
# PentAGI network and is reached by the backend as http://ingest:8000. Set
# INGEST_URL and INGEST_TOKEN in the backend environment to enable it.
services:
  ingest:
    build:
      context: ./ingest
    image: ${INGEST_IMAGE:-vxcontrol/pentagi-ingest:local}
    container_name: ${INGEST_CONTAINER_NAME:-pentagi-ingest}
    restart: unless-stopped
    environment:
      - INGEST_TOKEN=${INGEST_TOKEN:-}
      - INGEST_MAX_BYTES=${INGEST_MAX_BYTES:-}
    networks:
      - pentagi-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
